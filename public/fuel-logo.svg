<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stopColor="#005826" />
      <stop offset="1" stopColor="#003816" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stopColor="#F59E0B" />
      <stop offset="1" stopColor="#FBBF24" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Rounded Shield/Badge Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="95" height="95" rx="21.5" stroke="url(#goldGrad)" stroke-width="3" fill="none" opacity="0.85" />

  <!-- Modern Fuel Dispenser Silhouette -->
  <!-- Main Pump Body -->
  <rect x="22" y="26" width="32" height="52" rx="7" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Digital Screen (Green backlit) -->
  <rect x="27.5" y="32" width="21" height="15" rx="3.5" fill="#00471E" />
  <!-- Screen Text "9771" -->
  <text x="38" y="42.5" fill="#F59E0B" font-size="7.5" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">9771</text>

  <!-- Fuel Dispenser Base / Grill Line -->
  <line x1="28" y1="52" x2="48" y2="52" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="56" x2="48" y2="56" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

  <!-- Eco Relief Leaf & Droplet in White Base -->
  <path d="M38 60C34.5 64.5 34.5 71 38 73.5C41.5 71 41.5 64.5 38 60Z" fill="#10B981" />

  <!-- Flexible Nozzle Hose -->
  <path d="M54 41H63C66.5 41 69 43.5 69 47V66C69 68.5 66.5 71 64 71V65" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Nozzle Holster & Grip -->
  <path d="M63 58L68 53L65.5 49" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Growth / Relief Arrow pointing up-right -->
  <path d="M68 28L83 14M83 14H73M83 14V23" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
